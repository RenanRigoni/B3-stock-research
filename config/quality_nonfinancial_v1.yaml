# Quality Score nao-financeiro -- metodologia quality_nonfinancial_v1
# (fase2_plan.md 8, 17, 17.1). Bandas versionadas e FORA do codigo Python
# (mesmo espirito de settings.yaml / news_taxonomy.yaml). Recalibrar = novo
# arquivo (quality_nonfinancial_v2.yaml), nunca edicao silenciosa deste.
#
# Cada subitem tem: metric, weight, os 5 marcadores (0/25/50/75/100 pts,
# interpolacao LINEAR entre eles), e o tratamento de negativo/outlier/missing.
# Valores calibrados por referencia de mercado brasileiro geral -- todo
# resultado carrega calibration_status='provisional' (§17.3).

version: quality_nonfinancial_v1

window:
  max_years: 5          # ultimos 5 exercicios fiscais fechados (DFP anual)
  min_years: 3          # menos que isso num bloco -> insufficient_history

# Abaixo deste percentual do peso total com dado suficiente, o score inteiro
# vira score_status='incomplete' em vez de um numero parcial enganoso (§17.1).
min_weight_fraction_for_valid: 0.60

blocks:
  rentabilidade:
    weight: 25
    subitems:
      - key: net_margin_median
        metric: net_margin
        aggregation: median
        weight: 12
        markers: [0.0, 0.03, 0.08, 0.15, 0.25]   # 0/25/50/75/100 pts
        negative_anchors_floor: true             # <=0 ancora em 0 pts
        winsorize: [-0.50, 0.60]
      - key: roe_median
        metric: roe
        aggregation: median
        weight: 13
        markers: [0.0, 0.05, 0.12, 0.18, 0.25]
        negative_anchors_floor: true
        winsorize: [-1.00, 0.80]

  solidez_financeira:
    weight: 20
    subitems:
      - key: net_debt_to_equity_last
        metric: net_debt_to_equity          # derivada: net_debt / equity (ultima posicao)
        aggregation: last
        weight: 12
        markers: [1.5, 1.0, 0.5, 0.2, 0.0]  # DESCENDENTE: menor alavancagem = mais pontos
        descending: true
        winsorize: [-1.0, 3.0]
      - key: net_debt_to_equity_trend
        metric: net_debt_to_equity
        aggregation: trend                   # discreto: piorando/estavel/melhorando
        weight: 8
        trend_scores: {piorando: 0, estavel: 60, melhorando: 100}
        trend_stable_band: 0.10             # +-10% entre 1o e ultimo ano = "estavel"
        min_years_for_trend: 2

  geracao_de_caixa:
    weight: 20
    subitems:
      - key: fcf_margin_median
        metric: fcf_to_revenue              # derivada: free_cash_flow / revenue
        aggregation: median
        weight: 12
        markers: [0.0, 0.03, 0.08, 0.15, 0.20]
        negative_anchors_floor: true
        winsorize: [-0.50, 0.50]
      - key: fcf_conversion_median
        metric: fcf_to_net_income           # derivada: free_cash_flow / net_income
        aggregation: median
        weight: 8
        markers: [0.0, 0.5, 0.8, 1.0, 1.3]
        negative_anchors_floor: true
        winsorize: [-2.0, 3.0]
        exclude_year_if_denominator_non_positive: true   # net_income <= 0 -> ano fora

  consistencia:
    weight: 20
    subitems:
      - key: net_margin_cv
        metric: net_margin
        aggregation: coefficient_of_variation
        weight: 10
        # DESCENDENTE: menor variabilidade = mais pontos.
        markers_standard: [0.60, 0.40, 0.25, 0.12, 0.05]
        markers_commodity: [1.00, 0.70, 0.45, 0.25, 0.12]
        descending: true
        winsorize_before_cv: [-0.50, 0.60]   # mesma banda de net_margin (rentabilidade)
        min_years: 3
      - key: positive_net_income_fraction
        metric: net_income
        aggregation: positive_fraction
        weight: 10
        markers: [0.0, 0.40, 0.60, 0.80, 1.0]
        # nao winsoriza -- e contagem, nao razao continua

  crescimento:
    weight: 15
    subitems:
      - key: revenue_cagr
        metric: revenue
        aggregation: cagr
        weight: 8
        markers: [-0.05, 0.0, 0.05, 0.10, 0.15]
        winsorize: [-0.50, 0.50]
        requires_both_endpoints: true
      - key: net_income_cagr
        metric: net_income
        aggregation: cagr
        weight: 7
        markers: [-0.10, 0.0, 0.08, 0.15, 0.25]
        winsorize: [-0.80, 0.80]
        requires_both_endpoints: true
