# Universo investivel do backtest -- V1 (Fase 3 M1 + M2).
# Ver docs/historical_universe.md §7-§8 e docs/fase3_handoff_v2.md §6, §11.
#
# Nenhum valor de criterio fica escondido no codigo (fase3.md §15). Esta
# config e versionada; recalibrar = novo arquivo (v2), nunca editar o v1 em
# silencio.
#
# REGRA DE `null`: um limiar `null` significa "AINDA NAO APROVADO". O gate
# correspondente NAO e aplicado -- a distribuicao real e medida e reportada, e
# nada e reprovado por ele. Escolher numero sozinho para "melhorar" a cobertura
# e proibido (Opus, regra 7).

version: backtest_universe_v1

# --- Camada 1: elegibilidade ESTRUTURAL (M1) --------------------------------
# Decidida SO por tempo efetivo do lifecycle (Handoff §6). NAO ha gate de
# proveniencia.
eligibility:
  # Empresas SUSPENSO(A) do cadastro CVM entram no universo investivel?
  # false = ficam de fora da camada investivel (continuam no estrutural).
  include_suspended: false
  # Classe de acao aceita na V1. UNT/DR ficam para iteracao futura.
  # ASPAS OBRIGATORIAS: YAML 1.1 le ON/OFF/YES/NO como BOOLEANO -- sem as aspas
  # "ON" vira True e nenhuma acao ordinaria casa o filtro (bug real, mesma
  # classe do fase2_plan.md §31, com teste de regressao).
  allowed_share_classes: ["ON", "PN", "PNA", "PNB"]

# --- Camada 2: identificabilidade (M2) --------------------------------------
# Nao configuravel: e regra, nao parametro. So `resolved` e `seeded` viram
# instrumento investivel; `back_projected`, `unresolved_no_code` e
# `unresolved_invalid_code` sao SEMPRE reprovados e contados.
# Ver analytics/universe.py e transforms/instrument_lifecycle.py.

# --- Camada 3: liquidez (M2) -------------------------------------------------
# Infraestrutura PRONTA e medindo (liquidity_metrics, 24.822 linhas).
# Limiares AGUARDANDO APROVACAO DO OPUS -- ver a tabela de sensibilidade em
# docs/historical_universe.md §9.
liquidity:
  status: awaiting_opus_thresholds
  # Volume financeiro medio por pregao (BRL) na janela de 60 pregoes.
  min_avg_financial_volume_60: null
  # Mediana do volume financeiro em 60 pregoes -- robusto a leilao isolado.
  min_median_financial_volume_60: null
  # Pregoes COM negocio na janela de 60 (denominador em expected_trading_days_60).
  min_trading_days_60: null

# --- Camada 4: dados minimos (M2) -------------------------------------------
data_minimums:
  status: awaiting_opus_thresholds
  min_price_history_days: null
  require_fundamentals: null

# --- Proveniencia do universo (vintage) --------------------------------------
# Serve para backtest_runs.universe_version (spec §80) -- reprodutibilidade,
# nunca elegibilidade.
vintage:
  cadastro_source: cvm_cad
  fca_source: cvm_fca
  fca_years: "2010..corrente"
  liquidity_source: daily_prices
  liquidity_price_field: close   # BRUTO -- adj_close e proibido (look-ahead)
  notes: >
    ticker (Codigo_Negociacao) so existe no FCA a partir de 2018; antes disso
    instrument_lifecycle.ticker = NULL (unresolved_no_code). Quando presente,
    82 linhas trazem texto livre (unresolved_invalid_code). A cobertura de
    daily_prices no M2 e de 5 acoes + IBOV -- e o gate dominante do universo
    investivel.
