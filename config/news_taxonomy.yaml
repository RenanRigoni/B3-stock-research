  technology:
    scope: company
    keywords: [tecnologia, digitalizacao, inteligencia artificial, sistema, plataforma]
  labor:
    scope: company
    keywords: [funcionarios, contratacao, demissoes em massa, acordo coletivo]
  strike:
    scope: company
    keywords: [greve, paralisacao dos trabalhadores, sindicato]
  political:
    scope: macro
    keywords: [eleicao, congresso, governo federal, ministro, politica interna]
  geopolitical:
    scope: macro
    keywords: [guerra, sancoes, tensao geopolitica, opep, conflito internacional]
  rumor:
    scope: company
    keywords: [rumor, especulacao, fontes proximas, teria dito, nao confirmado, estuda a possibilidade]
  analyst_rating:
    scope: company
    keywords: [recomendacao de compra, recomendacao de venda, preco-alvo, corretora eleva, banco rebaixa]
  other:
    scope: mixed
    keywords: []

# Sinais lexicais para o classificador heuristico. Sentimento linguistico NAO e
# impacto economico -- ficam separados no schema (fase1.md 33).
sentiment_lexicon:
  positive: [alta, cresce, avanca, lucro recorde, supera expectativas, aprova, expande, eleva, recupera, acordo fechado]
  negative: [queda, recua, despenca, prejuizo, abaixo do esperado, rejeita, corta, suspende, adia, rompe, multa, condena]

# Marcadores de fonte oficial: comunicado da propria companhia ou do regulador.
official_source_markers:
  - fato relevante
  - comunicado ao mercado
  - aviso aos acionistas
  - ri.
  - relacoes com investidores
  - cvm.gov.br
  - b3.com.br

rumor_markers:
  - segundo fontes
  - pessoas familiarizadas
  - nao confirmado
  - teria
  - estuda a possibilidade
  - apurou
