[project]
name = "stock-research"
version = "0.1.0"
description = "Base historica de acoes da B3: precos, noticias, fundamentos e event study (Fase 1)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "MIT" }
authors = [{ name = "Renan Rigoni" }]

dependencies = [
    # CLI e apresentacao
    "typer>=0.15",
    "rich>=13.9",
    # Config
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # Dados
    "pandas>=2.2",
    "pyarrow>=18.0",
    "numpy>=2.1",
    # Banco (Supabase Postgres)
    "psycopg[binary]>=3.2",
    # Fontes externas
    "yfinance>=0.2.50",
    "httpx>=0.28",
    "tenacity>=9.0",
    # Texto / deduplicacao
    "rapidfuzz>=3.11",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Extracao opcional de texto publico de noticias (fase1.md secao 32).
# Nunca obrigatorio: o pipeline funciona sem isso.
text = [
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "mypy>=1.14",
    "types-pyyaml",
    "pre-commit>=4.0",
]

[project.scripts]
stock-research = "stock_research.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_research"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "E501",  # line-length ja controlado pelo formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "integration: acessa fontes externas reais (nao roda por padrao)",
    "db: exige conexao com o Supabase configurada",
    "slow: demora mais que alguns segundos",
]

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
